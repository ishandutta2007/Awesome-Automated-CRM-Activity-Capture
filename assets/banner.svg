<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      
      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }

      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }

      .floating-bg { animation: float 6s ease-in-out infinite; }
      .pulsing-glow { animation: pulse 4s ease-in-out infinite; }
      .animated-line { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Subtle Background Dynamic Grid / Lines -->
  <g class="pulsing-glow" stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
  </g>

  <!-- Dynamic Animated Graph & Sync Flow Lines (Positioned safely on sides/background) -->
  <g class="floating-bg" opacity="0.3">
    <!-- Activity Node Left -->
    <circle cx="120" cy="180" r="45" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    <path d="M100 180 L140 180 M120 160 L120 200" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Sync Flow Line -->
    <path d="M165 180 C 250 120, 350 240, 450 180" fill="none" stroke="#6366f1" stroke-width="3" class="animated-line"/>
    
    <!-- Activity Node Right -->
    <circle cx="1080" cy="170" r="50" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    <rect x="1060" y="150" width="40" height="40" rx="8" fill="none" stroke="#ec4899" stroke-width="3"/>
    
    <!-- Connection right -->
    <path d="M750 180 C 850 120, 950 240, 1030 170" fill="none" stroke="#a855f7" stroke-width="3" class="animated-line"/>
  </g>

  <!-- Glowing Accent Header Bar -->
  <rect x="100" y="55" width="1000" height="4" fill="url(#accentGrad)" rx="2"/>

  <!-- Foreground Content Block (Guaranteed Clear & Readable Overlay) -->
  <g filter="url(#glow)">
    <!-- Category Pill -->
    <rect x="460" y="75" width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="600" y="97" text-anchor="middle" class="badge-text">⚡ CRM ACTIVITY INTELLIGENCE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" class="title">Awesome Automated CRM Activity Capture 📧 🔄</text>
  
  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" class="subtitle">Curated Directory of Commercial Activity Capture &amp; Open-Source Sync Engines</text>
  
  <!-- Pill Tags Bottom -->
  <g transform="translate(300, 245)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.2)"/>
    <text x="90" y="21" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">📧 Email Auto-Logging</text>

    <!-- Tag 2 -->
    <rect x="200" y="0" width="200" height="32" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.2)"/>
    <text x="300" y="21" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">📅 Calendar &amp; Contact Sync</text>

    <!-- Tag 3 -->
    <rect x="420" y="0" width="180" height="32" rx="16" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.2)"/>
    <text x="510" y="21" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="500">🤖 Revenue Intelligence</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="400" y="305" width="400" height="3" fill="url(#accentGrad)" rx="1.5"/>
</svg>
